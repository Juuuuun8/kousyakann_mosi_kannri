<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン（合成プロトタイプ）</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div><p class="eyebrow">Kousyakann Mosi Kannri / prototype</p><h1>模試成績管理</h1></div>
      <span class="role-badge">会社承認前 · 本番未接続</span>
    </header>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">SIGN IN</p>
        <h2 id="login-title">ログイン</h2>
        <p class="auth-description">管理者が事前登録したメールアドレスとパスワードを入力してください。権限はログイン後も各APIで再確認します。</p>
        <form id="login-form" class="auth-form" novalidate>
          <label>メールアドレス<input id="email" name="email" type="email" inputmode="email" autocomplete="username" required></label>
          <label>パスワード<input id="password" name="password" type="password" autocomplete="current-password" minlength="15" maxlength="128" required></label>
          <button class="action" type="submit">ログイン</button>
        </form>
        <p id="login-error" class="auth-error" role="alert" hidden>メールアドレスまたはパスワードを確認してください。</p>
        <p class="auth-help">この画面は表示確認用です。入力値を保存・送信しません。本番では平文パスワードを権限管理シートへ保存せず、復元できない検証値だけを保持します。</p>
      </section>
    </main>
    <script type="module" src="./src/login.js"></script>
  </body>
</html>
