<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>模試成績分析（合成プロトタイプ）</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Kousyakann Mosi Kannri / prototype</p>
        <h1>模試成績分析</h1>
      </div>
      <div class="role-badge" aria-label="現在の権限">ADMIN · 全校舎閲覧</div>
    </header>

    <main class="shell">
      <nav class="tabs" aria-label="分析タブ">
        <button class="tab is-active" data-tab="overview">概要</button>
        <button class="tab" data-tab="groups">校舎・学校比較</button>
        <button class="tab" data-tab="subjects">科目・分野</button>
        <button class="tab" data-tab="targets">志望校</button>
        <button class="tab" data-tab="individual">個人詳細</button>
        <button class="tab" data-tab="quality">データ管理</button>
        <button class="tab" data-tab="ml">ML出力</button>
      </nav>

      <section class="toolbar" aria-labelledby="filter-title">
        <div class="toolbar-heading">
          <div>
            <p class="eyebrow">COMMON FILTER</p>
            <h2 id="filter-title">対象を絞り込む</h2>
          </div>
          <span class="version-chip">ExamEvent · 2026 / Round 2</span>
        </div>
        <div class="filter-grid">
          <label>校舎<select><option>全校舎</option><option>合成校舎A</option><option>合成校舎B</option></select></label>
          <label>高校<select><option>全高校</option><option>合成高校A</option><option>合成高校B</option></select></label>
          <label>科目<select><option>全科目</option><option>英語</option><option>数学</option><option>国語</option></select></label>
          <label>抑制人数<input type="number" value="5" min="1" step="1"></label>
        </div>
        <div class="filter-footnote">母数・除外数・欠損理由は各カードに表示。小人数群の値は自動抑制。</div>
      </section>

      <section class="state-preview" aria-labelledby="state-title">
        <div>
          <p class="eyebrow">DEVELOPMENT PREVIEW</p>
          <h2 id="state-title">状態表示の確認</h2>
        </div>
        <label>状態<select id="state-select">
          <option value="ready">Ready</option>
          <option value="loading">Loading</option>
          <option value="empty">Empty</option>
          <option value="suppressed">Suppressed</option>
          <option value="partial">Partial data</option>
          <option value="schema">Schema mismatch</option>
          <option value="permission">No permission</option>
        </select></label>
      </section>

      <section id="app" aria-live="polite"></section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
