<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>模試成績分析（会社説明用デモ）</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Kousyakann Mosi Kannri / company demo</p>
        <h1>模試成績分析</h1>
      </div>
      <div class="topbar-actions"><span class="role-badge demo-badge">架空データのみ</span><span class="role-badge" aria-label="現在の権限">ADMIN · 全校舎閲覧</span><a class="role-badge topbar-link" href="./upload.html">PDF登録</a><a class="role-badge topbar-link" href="./login.html">ログイン画面</a></div>
    </header>

    <main class="shell">
      <nav class="tabs" aria-label="分析タブ" role="tablist">
        <button class="tab is-active" data-tab="overview" role="tab" aria-selected="true" aria-controls="app">概要</button>
        <button class="tab" data-tab="groups" role="tab" aria-selected="false" aria-controls="app" tabindex="-1">校舎・学校比較</button>
        <button class="tab" data-tab="subjects" role="tab" aria-selected="false" aria-controls="app" tabindex="-1">科目・分野</button>
        <button class="tab" data-tab="targets" role="tab" aria-selected="false" aria-controls="app" tabindex="-1">志望校</button>
        <button class="tab" data-tab="individual" role="tab" aria-selected="false" aria-controls="app" tabindex="-1">個人詳細</button>
        <button class="tab" data-tab="quality" role="tab" aria-selected="false" aria-controls="app" tabindex="-1">データ管理</button>
        <button class="tab" data-tab="ml" role="tab" aria-selected="false" aria-controls="app" tabindex="-1">ML出力</button>
      </nav>

      <section class="toolbar" aria-labelledby="filter-title">
        <div class="toolbar-heading">
          <div>
            <p class="eyebrow">COMMON FILTER</p>
            <h2 id="filter-title">対象を絞り込む</h2>
          </div>
          <span id="dataset-version" class="version-chip">データ読込中</span>
        </div>
        <div class="filter-grid">
          <label>校舎<select id="location-filter"><option value="all">全校舎</option></select></label>
          <label>高校<select id="school-filter"><option value="all">全高校</option></select></label>
          <label>科目<select id="subject-filter"><option value="all">全科目</option></select></label>
          <label>比較基準<select><option>全体</option><option>全国掲載値</option><option>同学力帯掲載値</option><option>前回同一Person</option></select></label>
          <label>抑制人数<input id="suppression-filter" type="number" value="5" min="1" max="20" step="1"></label>
        </div>
        <div id="data-summary" class="filter-footnote">架空データを読み込んでいます。</div>
      </section>

      <section class="state-preview" aria-labelledby="state-title">
        <div>
            <p class="eyebrow">DEMO STATE PREVIEW</p>
          <h2 id="state-title">状態表示の確認</h2>
        </div>
        <label>状態<select id="state-select">
          <option value="ready">Ready</option>
          <option value="loading">Loading</option>
          <option value="empty">Empty</option>
          <option value="suppressed">Suppressed</option>
          <option value="partial">Partial data</option>
          <option value="schema">Schema mismatch</option>
          <option value="permission">No permission</option>
        </select></label>
      </section>

      <section id="app" role="tabpanel" aria-live="polite" tabindex="0"></section>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
